[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "deep-ultra"
version = "0.5.0"
description = "Context-aware multi-model coding assistant CLI"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "holidays>=0.60"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
deep-ultra = "deep_ultra.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
deep_ultra = ["catalog.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
